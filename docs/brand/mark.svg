<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Thrym mark, transparent. Android adaptive-icon foreground (1024 units = 108 dp).
    Geometry: the rune Thurisaz built from the end of a loaded barbell, side view.
      stave = big bumper plate; thorn = two smaller plates stepping down the sleeve; point = sleeve tip.
    Thorn (middle plate) spans 50 % of the stave, so the stave clearly rises above and below it (rune, not play glyph).
    Chamfered plate profiles, every vertex rounded with a circular arc (cubic). Only paths and linear/radial
    gradients in userSpaceOnUse; no text, strokes, filters, masks, patterns, transforms or bitmaps.
    Safe circle (66 dp) = r 313 around (512,512); furthest vertex of the mark = 263 units (margin 50).
    Corner radius 14.1. Optically centred: bbox centre 10 % of the mark width right of centre.
  -->
  <defs>
    <linearGradient id="iron" x1="0" y1="277" x2="0" y2="747" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B1A10"/>
      <stop offset="1" stop-color="#140B06"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="474.4" x2="0" y2="549.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A4752"/>
      <stop offset="0.2" stop-color="#C9D7E2"/>
      <stop offset="0.3" stop-color="#C9D7E2"/>
      <stop offset="0.5" stop-color="#3E4C57"/>
      <stop offset="1" stop-color="#151C21"/>
    </linearGradient>
  </defs>
  <g id="thurs-mark">
    <!-- sleeve (steel): hidden under the stave, shows in the plate gaps and as the tip -->
    <path id="sleeve" fill="url(#steel)" d="M443.9 474.4 L732.5 474.4 C740.3 474.4 746.6 480.7 746.6 488.5 L746.6 535.5 C746.6 543.3 740.3 549.6 732.5 549.6 L443.9 549.6 Z"/>
    <!-- stave: big plate -->
    <path id="stave" fill="url(#iron)" d="M389.1 281.1 C391.7 278.5 395.3 277 399 277 L428.7 277 C432.4 277 436 278.5 438.7 281.1 L468 310.5 C470.7 313.1 472.1 316.7 472.1 320.4 L472.1 703.6 C472.1 707.3 470.7 710.9 468 713.5 L438.7 742.9 C436 745.5 432.4 747 428.7 747 L399 747 C395.3 747 391.7 745.5 389.1 742.9 L359.7 713.5 C357.1 710.9 355.6 707.3 355.6 703.6 L355.6 320.4 C355.6 316.7 357.1 313.1 359.7 310.5 Z"/>
    <!-- thorn step 1: middle plate -->
    <path id="plate2" fill="url(#iron)" d="M509.4 398.6 C512 396 515.6 394.5 519.3 394.5 L562.2 394.5 C565.9 394.5 569.5 396 572.2 398.6 L592.1 418.6 C594.7 421.2 596.2 424.8 596.2 428.5 L596.2 595.5 C596.2 599.2 594.7 602.8 592.1 605.4 L572.2 625.4 C569.5 628 565.9 629.5 562.2 629.5 L519.3 629.5 C515.6 629.5 512 628 509.4 625.4 L489.4 605.4 C486.8 602.8 485.3 599.2 485.3 595.5 L485.3 428.5 C485.3 424.8 486.8 421.2 489.4 418.6 Z"/>
    <!-- thorn step 2: small plate -->
    <path id="plate3" fill="url(#iron)" d="M628.8 438.1 C631.4 435.5 635 434 638.7 434 L674 434 C677.8 434 681.4 435.5 684 438.1 L699.3 453.4 C701.9 456 703.4 459.6 703.4 463.3 L703.4 560.7 C703.4 564.4 701.9 568 699.3 570.6 L684 585.9 C681.4 588.5 677.8 590 674 590 L638.7 590 C635 590 631.4 588.5 628.8 585.9 L613.5 570.6 C610.9 568 609.4 564.4 609.4 560.7 L609.4 463.3 C609.4 459.6 610.9 456 613.5 453.4 Z"/>
