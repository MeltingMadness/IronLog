<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="658.8" height="218" viewBox="0 0 658.784 218.0">
  <!--
    Thrym horizontal lockup, transparent background. Universal: amber word, readable on light (3.2:1 on white) and dark backgrounds.
    Mark (amber plates, steel sleeve) + "THRYM" drawn as geometric Latin capitals in the spirit of Geist Bold
    (paths only, no font). Brand rule: never pair the mark with other runes, a runic spelling of the name,
    rune-in-circle frames or a black-white-red palette.
  -->
  <defs>
    <linearGradient id="amber-plate" x1="0" y1="28" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#E85500"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="96" x2="0" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B6B78"/>
      <stop offset="0.2" stop-color="#D5E0E8"/>
      <stop offset="0.3" stop-color="#D5E0E8"/>
      <stop offset="0.5" stop-color="#6C7E8C"/>
      <stop offset="1" stop-color="#34414B"/>
    </linearGradient>
  </defs>
  <g id="thurs-mark">
    <!-- sleeve (steel): hidden under the stave, shows in the plate gaps and as the tip -->
    <path id="sleeve" fill="url(#steel)" d="M58.5 96 L157.9 96 C160.6 96 162.8 98.2 162.8 100.9 L162.8 117.1 C162.8 119.8 160.6 122 157.9 122 L58.5 122 Z"/>
