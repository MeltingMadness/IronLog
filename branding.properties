# Anzeigename der App auf Android und iOS (Startbildschirm, Store-unabhängige Texte, Benachrichtigungen).
# Nach einer Änderung `python3 iosApp/generate_project.py` ausführen, damit das iOS-Projekt den Namen übernimmt.
# Die technischen IDs (Android applicationId com.thrym.app, iOS Bundle-ID com.thrym.ios) stehen in
# app/build.gradle.kts und iosApp/generate_project.py und hängen nicht von diesem Wert ab.
appDisplayName=Thrym
