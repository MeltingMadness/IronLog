# Anzeigename der App auf Android und iOS (Startbildschirm, Store-unabhängige Texte, Benachrichtigungen).
# Gilt für alle Sprachen und wird nicht übersetzt.
# Android liest den Wert beim Bauen. Nach einer Änderung `python3 iosApp/generate_project.py` ausführen,
# damit das iOS-Projekt den Namen übernimmt.
# Die technischen IDs hängen nicht von diesem Wert ab: Android applicationId com.thrym.app in
# app/build.gradle.kts, iOS Bundle-ID com.thrym.ios (THRYM_BUNDLE_ID) in iosApp/Config/Signing.xcconfig.
# Der Name „Thrym“ ist nicht für Forks lizenziert. Ein Fork setzt hier einen eigenen Namen und ändert
# auch Icon, applicationId und Bundle-ID.
appDisplayName=Thrym
