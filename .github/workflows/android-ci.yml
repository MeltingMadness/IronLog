name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'sprint/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  unit-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests + lint + debug build
        run: ./gradlew --no-daemon test lintDebug assembleDebug

      - name: Upload unit/lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-unit-lint
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml

  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: unit-lint-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Public GitHub-hosted Ubuntu runners expose /dev/kvm, but the runner user
      # is not in the kvm group by default. Without this, the emulator falls back
      # to software acceleration and intermittently fails with
      # "Can't find service: package" during APK install.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          # Keep script as a single line: the action invokes it via `sh -c`,
          # so embedded quotes/newlines are fragile.
          script: .github/scripts/wait-for-package-manager.sh && ./gradlew --no-daemon :app:connectedDebugAndroidTest

      # connectedDebugAndroidTest can "succeed" while running zero tests
      # (broken emulator/instrumentation setup). Parse the result XMLs and
      # fail the gate when there is no report or no executed test.
      - name: Guard against zero executed smoke tests
        if: always()
        run: python3 .github/scripts/guard-zero-tests.py

      - name: Upload androidTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-android-test
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  # Unsigned release evidence, built only from trusted refs. This is NOT a
  # release: it deliberately builds without signing secrets, labels the
  # uploaded evidence as unsigned, records SHA-256 hashes and fails on missing core
  # artifacts. Signing/release publication is a separate manual step (see
  # docs/release-envelope.md).
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - unit-lint-build
      - android-smoke
    # Automatic runs only for main pushes and v* tags; manual dispatch is
    # intentionally allowed on any selected ref. Pull requests never run it.
    if: >
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK and AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Validate artifacts and generate SHA-256 manifest
        run: python3 .github/scripts/release-artifacts.py --strict

      # The Gradle config only attaches a signingConfig when keystore.properties
      # exists; CI does not provide one, so the release artifacts are unsigned.
      - name: Emit unsigned evidence notice
        run: echo "::warning::Release artifacts are UNSIGNED CI evidence, not a release. Sign manually (see docs/release-envelope.md)."

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload merged release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-merged-manifest
          path: app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 90

      - name: Upload SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-sha256-manifest
          path: app/build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
