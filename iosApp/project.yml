name: ThrymIOS
options:
  developmentLanguage: en
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: ThrymIOS
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ThrymIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: ThrymIOS
    dependencies:
      - framework: ../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/Shared.framework
        embed: false
        codeSign: false
    info:
      path: ThrymIOS/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleLocalizations: [en, de]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THRYM_BUNDLE_ID) # aus Config/Signing.xcconfig
        APP_DISPLAY_NAME: Thrym # aus ../branding.properties, siehe generate_project.py
        INFOPLIST_FILE: ThrymIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    preBuildScripts:
      - name: Build Shared Framework
        script: |
          "$SRCROOT/scripts/build-shared.sh"
  ThrymIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: ThrymIOSTests
    dependencies:
      - target: ThrymIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(THRYM_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ThrymIOS:
    build:
      targets:
        ThrymIOS: all
        ThrymIOSTests: [test]
    test:
      targets:
        - ThrymIOSTests
